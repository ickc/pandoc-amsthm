name: Python package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for Codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        # python and pandoc versions increase together, see [tool.pixi.environments] in pyproject.toml
        environment:
          - test-py310
          - test-py311
          - test-py312
        experimental: [false]
        include:
          # tests/model-latex.tex is generated by pandoc <= 3.1.3;
          # newer pandoc LaTeX writers differ cosmetically (hypertarget), expected to fail until regenerated
          - environment: test-py313
            experimental: true
          - environment: test-py314
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.environment }}
          locked: true
      - name: Sanity check
        run: |
          pixi run -e ${{ matrix.environment }} pandoc --version
          pixi run -e ${{ matrix.environment }} python -c 'import amsthm; print(amsthm.__version__)'
      - name: Tests
        run: pixi run -e ${{ matrix.environment }} coverage
      - name: Coverage—Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          disable_search: true
          flags: ${{ matrix.environment }}
          use_oidc: true
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: lint
          locked: true
      - run: pixi run -e lint lint
