name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # default is the latest pandoc 3.x; pandoc-min is the oldest supported
        environment: [default, pandoc-min]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.environment }}
          locked: true
      - run: pixi run -e ${{ matrix.environment }} pandoc --version
      - run: pixi run -e ${{ matrix.environment }} test
