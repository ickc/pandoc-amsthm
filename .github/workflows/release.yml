name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches versions
        run: |
          pixi_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pixi.toml", "rb"))["workspace"]["version"])')"
          ext_version="$(sed -n 's/^version: *//p' _extensions/amsthm/_extension.yml)"
          echo "tag: ${GITHUB_REF_NAME}, pixi.toml: ${pixi_version}, _extension.yml: ${ext_version}"
          test "${GITHUB_REF_NAME}" = "v${pixi_version}"
          test "${GITHUB_REF_NAME}" = "v${ext_version}"
      - run: gh release create "$GITHUB_REF_NAME" _extensions/amsthm/amsthm.lua --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
