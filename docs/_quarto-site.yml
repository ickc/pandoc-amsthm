# This site's own settings, merged on top of the shared `_quarto.yml` from
# https://github.com/ickc/quarto-template (see there for how the two combine).
project:
  output-dir: _site

website:
  title: "pandoc-amsthm"
  site-url: "https://ickc.github.io/pandoc-amsthm"
  description: "amsthm theorem environments for Pandoc and Quarto"
  repo-url: https://github.com/ickc/pandoc-amsthm
  repo-actions: [source, issue]
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Examples
        menu:
          - href: examples.qmd
            text: Overview
          - href: examples/basics.md
            text: Basics
          - href: examples/cross-references.md
            text: Cross-references
          - href: examples/numbering.md
            text: Numbering
          - href: examples/proofs.md
            text: Proofs
          - href: examples/styles.md
            text: Styles
          - href: examples/swapnumbers.md
            text: Swapped numbers
          - text: "---"
          - href: example/index.md
            text: Full example
          - href: source.qmd
            text: Full example source
      - href: design.qmd
        text: Design
      - href: changelog.qmd
        text: Changelog
    right:
      - icon: github
        href: https://github.com/ickc/pandoc-amsthm
        aria-label: GitHub
  page-footer:
    left: "© {{< copyright-year 2016 >}} Kolen Cheung · BSD-3-Clause"

shortcodes:
  # {{< copyright-year 2016 >}}, as a plain shortcode rather than the template's
  # copyright-year extension: docs/_extensions is a symlink to the package's
  # own _extensions/, which `quarto add ickc/pandoc-amsthm` installs.
  - copyright-year.lua
