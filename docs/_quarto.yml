project:
  type: website
  output-dir: _site

website:
  title: "pandoc-amsthm"
  site-url: "https://ickc.github.io/pandoc-amsthm"
  description: "amsthm theorem environments for Pandoc and Quarto"
  repo-url: https://github.com/ickc/pandoc-amsthm
  repo-actions: [source, issue]
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Examples
        menu:
          - href: examples.qmd
            text: Overview
          - href: examples/basics.md
            text: Basics
          - href: examples/cross-references.md
            text: Cross-references
          - href: examples/numbering.md
            text: Numbering
          - href: examples/proofs.md
            text: Proofs
          - href: examples/styles.md
            text: Styles
          - href: examples/swapnumbers.md
            text: Swapped numbers
          - text: "---"
          - href: example/index.md
            text: Full example
          - href: source.qmd
            text: Full example source
      - href: design.qmd
        text: Design
      - href: changelog.qmd
        text: Changelog
    right:
      - icon: github
        href: https://github.com/ickc/pandoc-amsthm
        aria-label: GitHub
  page-footer:
    left: "© {{< copyright-year 2016 >}} Kolen Cheung · BSD-3-Clause"

shortcodes:
  # {{< copyright-year 2016 >}}, as in blog.kolen.dev
  - copyright-year.lua

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    respect-user-color-scheme: true
    html-math-method: mathjax
    toc: true
    code-copy: true
    # TeX Gyre Schola and JetBrains Mono, named in custom.scss, served by
    # https://font.kolen.dev. Both preconnects are needed: the font fetches
    # are anonymous-mode CORS and use a different connection pool from the
    # stylesheet request.
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://font.kolen.dev">
          <link rel="preconnect" href="https://font.kolen.dev" crossorigin>
          <link rel="stylesheet" href="https://font.kolen.dev/assets/faces.css">
