project:
  type: website
  output-dir: _site
  resources:
    # built by `pixi run docs-pdf`
    - example.pdf

website:
  title: "pandoc-amsthm"
  site-url: "https://ickc.github.io/pandoc-amsthm"
  description: "amsthm theorem environments for Pandoc and Quarto"
  repo-url: https://github.com/ickc/pandoc-amsthm
  repo-actions: [source, issue]
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: example/index.md
        text: Example
      - href: source.qmd
        text: Source
      - href: changelog.qmd
        text: Changelog
    right:
      - icon: github
        href: https://github.com/ickc/pandoc-amsthm
        aria-label: GitHub
  page-footer:
    left: "© Kolen Cheung · BSD-3-Clause"

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    respect-user-color-scheme: true
    html-math-method: mathjax
    toc: true
    code-copy: true
    # TeX Gyre Schola and JetBrains Mono, named in custom.scss, served by
    # https://font.kolen.dev. Both preconnects are needed: the font fetches
    # are anonymous-mode CORS and use a different connection pool from the
    # stylesheet request.
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://font.kolen.dev">
          <link rel="preconnect" href="https://font.kolen.dev" crossorigin>
          <link rel="stylesheet" href="https://font.kolen.dev/assets/faces.css">
