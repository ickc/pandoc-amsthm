[workspace]
name = "pandoc-amsthm"
description = "A native Pandoc Lua filter implementing the amsthm theorem/proof environments."
authors = ["Kolen Cheung <christian.kolen@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
pandoc = ">=3,<4"
lua = "5.4.*"
luarocks = "*"

[tasks]
# Tests run under pandoc's bundled Lua so the `pandoc` global (used to
# construct AST elements in unit specs) is available. A built-in
# busted-compatible shim (spec/busted_shim.lua) provides
# describe/it/assert, so the suite needs no extra deps; if a real
# `busted` ever ends up on the Lua path it is used preferentially.
test        = "pandoc lua spec/run.lua"
test-unit   = "pandoc lua spec/run.lua spec/emph_spec.lua spec/cite_spec.lua"
test-golden = "pandoc lua spec/run.lua spec/golden_spec.lua"

# Optional: install real busted via luarocks. NOTE: conda-forge's luarocks
# package runs under luajit and currently fails to parse the
# luarocks.org manifest (luajit's 65536-constant bytecode limit).
# When that's fixed upstream the shim becomes redundant.
install-test-deps = "luarocks --lua-version 5.4 --tree .luarocks install busted"

demo-latex = "pandoc -L amsthm.lua tests/model-source.md --top-level-division=chapter --toc -N -o tests/model-latex.pdf"
demo-html  = "pandoc -L amsthm.lua tests/model-source.md --toc -N -s -o tests/model-html.html"
gen-golden = """
pandoc -L amsthm.lua tests/model-source.md --top-level-division=chapter --toc -N -t latex -o tests/model-latex.tex && \
pandoc -L amsthm.lua tests/model-source.md -t markdown -o tests/model-target.md\
"""
