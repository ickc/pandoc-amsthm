[workspace]
name = "pandoc-amsthm"
version = "3.0.0"
description = "amsthm theorem environments for Pandoc and Quarto, as a Lua filter"
authors = ["Kolen Cheung <christian.kolen@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[dependencies]
pandoc = ">=3.1.1,<4"

[tasks]
# The suite runs under pandoc's bundled Lua, so the `pandoc` module is
# available to unit specs. spec/busted_shim.lua stands in for busted.
test = { cmd = "pandoc lua spec/run.lua", description = "Run all specs" }
test-unit = { cmd = "pandoc lua spec/run.lua spec/emph_spec.lua spec/cite_spec.lua", description = "Run unit specs only" }
test-golden = { cmd = "pandoc lua spec/run.lua spec/golden_spec.lua", description = "Compare filter output against tests/model-*" }
gen-golden = { cmd = """
pandoc -L _extensions/amsthm/amsthm.lua tests/model-source.md --top-level-division=chapter --toc -N -t latex -o tests/model-latex.tex && \
pandoc -L _extensions/amsthm/amsthm.lua tests/model-source.md -t markdown -o tests/model-target.md
""", description = "Regenerate the golden files in tests/" }

# Oldest pandoc 3.x on conda-forge. It has no osx-arm64 build, and this
# environment exists for CI, so it is linux only.
[feature.pandoc-min]
platforms = ["linux-64"]

[feature.pandoc-min.dependencies]
pandoc = "==3.1.1"

[feature.docs.dependencies]
quarto = ">=1.4"
tectonic = "*"

[feature.docs.tasks]
docs-pdf = { cmd = "pandoc -L _extensions/amsthm/amsthm.lua tests/model-source.md --top-level-division=chapter --toc -N --pdf-engine=tectonic -o docs/example.pdf", description = "Build the LaTeX demo PDF shown on the site" }
docs = { cmd = "quarto render docs", depends-on = ["docs-pdf"], description = "Render the documentation site to docs/_site" }
docs-preview = { cmd = "quarto preview docs", depends-on = ["docs-pdf"], description = "Serve the documentation site with live reload" }

[environments]
pandoc-min = { features = ["pandoc-min"] }
docs = { features = ["docs"] }
