[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "amsthm"
version = "2.0.0"
description = "amsthm—provide a syntax to use amsthm environments in pandoc, with output in LaTeX and HTML"
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
keywords = ["pandoc", "amsthm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
# panflute is responsible for pandoc compatibility.
# Each panflute minor release has tracked a pandoc API bump,
# so cap at the latest tested minor release.
dependencies = ["panflute>=2.3.1,<2.4"]

[project.optional-dependencies]
extras = ["coloredlogs>=14,<16"]

[project.scripts]
amsthm = "amsthm:main"

[project.urls]
Homepage = "https://github.com/ickc/pandoc-amsthm"
Repository = "https://github.com/ickc/pandoc-amsthm"
Documentation = "https://ickc.github.io/pandoc-amsthm"
Changelog = "https://github.com/ickc/pandoc-amsthm/blob/master/CHANGELOG.md"

[dependency-groups]
test = ["pytest", "coverage>=7.10"]
docs = ["sphinx", "sphinx-bootstrap-theme", "sphinxcontrib-apidoc"]
lint = ["ruff", "mypy"]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
]

[tool.uv.build-backend]
source-include = [
    "tests/**",
    "docs/**",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CONTRIBUTING.rst",
]

# pixi: development environments ###############################################
# pandoc comes from conda-forge; everything Python comes from PyPI.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
pandoc = "*"

[tool.pixi.pypi-dependencies]
amsthm = { path = ".", editable = true, extras = ["extras"] }

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# pandoc versions, oldest supported to latest
[tool.pixi.feature.pandoc-2-14.dependencies]
pandoc = "2.14.0.3.*"
[tool.pixi.feature.pandoc-2-19.dependencies]
pandoc = "2.19.2.*"
[tool.pixi.feature.pandoc-3-1.dependencies]
pandoc = "3.1.3.*"
[tool.pixi.feature.pandoc-3-5.dependencies]
pandoc = "3.5.*"

[tool.pixi.feature.pandoc-2-14]
platforms = ["linux-64"]
[tool.pixi.feature.pandoc-2-19]
platforms = ["linux-64"]

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
# CI matrix: python and pandoc versions increase together
test-py310 = ["test", "py310", "pandoc-2-14"]
test-py311 = ["test", "py311", "pandoc-2-19"]
test-py312 = ["test", "py312", "pandoc-3-1"]
test-py313 = ["test", "py313", "pandoc-3-5"]
test-py314 = ["test", "py314"]

[tool.pixi.tasks]
test = "coverage run -m pytest -vv"
coverage = { cmd = "coverage combine && coverage report && coverage xml", depends-on = ["test"] }
docs = "make docs -B"
linkcheck = "make linkcheck"
build = "uv build"

[tool.pixi.feature.lint.tasks]
format = "ruff format src tests docs/conf.py && ruff check --fix src tests docs/conf.py"
lint = "ruff format --check src tests docs/conf.py && ruff check src tests docs/conf.py && mypy src"

[tool.pixi.feature.dev.dependencies]
uv = "*"

[tool.coverage.paths]
source = [
    'src',
    '*/site-packages',
]

[tool.coverage.run]
branch = true
# concurrency = ["thread", "multiprocessing"]
source = [
    'src',
    'tests',
]
parallel = true
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.pytest.ini_options]

addopts = [
    '-ra',
    '--strict-markers',
    '--tb=auto',
]

testpaths = [
    'tests',
]

[tool.mypy]
#* Import discovery
mypy_path = "src"
# files
# exclude
# namespace_packages
# explicit_package_bases
ignore_missing_imports = true
# follow_imports
# follow_imports_for_stubs
# python_executable
# no_site_packages
# no_silence_site_packages

#* Platform configuration...

#* Disallow dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = false

#* Untyped definitions and calls
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false

#* None and Optional handling
no_implicit_optional = true
strict_optional = true

#* Configuring warnings
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
warn_unreachable = true

#* Suppressing errors...

#* Miscellaneous strictness flags...

#* Configuring error messages
show_error_context = false
show_column_numbers = false
show_error_codes = true
pretty = false
color_output = true
error_summary = true
show_absolute_path = false

#* Incremental mode...

#* Advanced options...

#* Report generation...

#* Miscellaneous
# junit_xml
# scripts_are_modules
warn_unused_configs = true
# verbosity

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["amsthm"]
